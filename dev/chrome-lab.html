<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chrome lab</title>
<!--
  Comparing the sheet's three layouts on a REAL page.

  Not a mock-up. The frame below loads a built `index.html` — the same file the
  demo site publishes, with its own three.js scene, its own spec and both its
  languages — and this page only flips `data-chrome` on it and resizes the
  viewport around it. So what you are comparing is the thing itself at the width
  you chose, including how each layout sits over the actual model, and any CSS
  written to win an argument here is CSS that already shipped.

  The frame is sized in LOGICAL pixels and scaled down to fit the pane, so the
  stylesheet's breakpoints evaluate against the width on the label rather than
  against however much room this window happens to have.

      node bin/b2d.mjs build examples/mbt-mk6/spec.json --out out/mbt-mk6
      node bin/b2d.mjs serve
      open http://localhost:5178/dev/chrome-lab.html
-->
<style>
  :root {
    --ink: #1b2745;
    --soft: #5e6b87;
    --line: #c3cedb;
    --paper: #f4f6f9;
    --mono: ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-columns: 224px 1fr;
    font: 12px/1.45 var(--mono);
    color: var(--ink);
    background: #dfe5ec;
    overflow: hidden;
  }

  aside {
    background: var(--paper);
    border-right: 1px solid var(--line);
    padding: 14px 13px;
    overflow: auto;
  }
  h1 {
    margin: 0 0 3px;
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
  }
  aside p.sub { margin: 0 0 14px; color: var(--soft); font-size: 10.5px; }
  fieldset { border: 1px solid var(--line); margin: 0 0 12px; padding: 8px 9px 10px; }
  legend {
    padding: 0 5px;
    font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--soft);
  }
  .opts { display: grid; gap: 4px; }
  button {
    font: inherit; font-size: 11px;
    text-align: left;
    padding: 5px 8px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  button:hover { background: #eef2f7; }
  button[aria-pressed="true"] {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  button .hint { display: block; font-size: 9.5px; opacity: .72; letter-spacing: .02em; }
  .row { display: grid; grid-auto-flow: column; gap: 4px; }

  main {
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 18px;
  }
  #stagebox { position: relative; }
  #shell {
    position: relative;
    border: 1px solid #8e9cae;
    background: #eaeef2;
    box-shadow: 0 18px 50px -22px rgba(20, 30, 50, .7);
    transform-origin: top left;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #caption {
    margin-top: 9px;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--soft);
    text-align: center;
  }
  #warn {
    grid-column: 1 / -1;
    padding: 10px 14px;
    background: #fde8e8;
    border-bottom: 1px solid #e0a3a3;
    color: #8a2020;
    font-size: 11px;
  }
  #warn[hidden] { display: none; }
</style>
</head>
<body>
<div id="warn" hidden></div>
<aside>
  <h1>chrome lab</h1>
  <p class="sub">Three layouts, one real page.</p>

  <fieldset>
    <legend>layout</legend>
    <div class="opts" id="variants"></div>
  </fieldset>

  <fieldset>
    <legend>viewport</legend>
    <div class="opts" id="sizes"></div>
  </fieldset>

  <fieldset>
    <legend>sheet</legend>
    <div class="opts" id="sheets"></div>
  </fieldset>

  <fieldset>
    <legend>language</legend>
    <div class="row" id="langs"></div>
  </fieldset>

  <fieldset>
    <legend>drive it</legend>
    <div class="opts" id="drive"></div>
  </fieldset>
</aside>

<main>
  <div id="stagebox">
    <div id="shell"><iframe id="frame" title="built sheet"></iframe></div>
    <div id="caption"></div>
  </div>
</main>

<script type="module" src="./chrome-lab.mjs"></script>
</body>
</html>
